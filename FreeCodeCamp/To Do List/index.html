<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <ul class="todo-list">
      <li>
        <input type="checkbox" id="todo-1" />
        <label for="todo-1">Learn HTML</label>

        <ul class="sub-item">
          <li>
            <link
              class="sub-item-link"
              href="https://www.freecodecamp.org/"
              target="_blank"
            >
              Learn HTML on freeCodeCamp
            </meta>
          </link>
        </ul>
      </li>

      <li>
        <input type="checkbox" id="todo-2" />
        <label for="todo-2">Learn CSS</label>

        <ul class="sub-item">
          <li>
            <link
              class="sub-item-link"
              href="https://developer.mozilla.org/"
              target="_blank"
            >
              Learn CSS on MDN
            </>
          </link>
        </ul>
      </li>

      <li>
        <input type="checkbox" id="todo-3" />
        <label for="todo-3">Learn JavaScript</label>

        <ul class="sub-item">
          <li>
            <link
              class="sub-item-link"
              href="https://javascript.info/"
              target="_blank"
            >
              Learn JavaScript
            </>
          </link>
        </ul>
      </li>

      <li>
        <input type="checkbox" id="todo-4" />
        <label for="todo-4">Build a Project</label>

        <ul class="sub-item">
          <li>
            <link
              class="sub-item-link"
              href="https://github.com/"
              target="_blank"
            >
              Visit GitHub
            </>
          </link>
        </ul>
      </li>
    </ul>
  </body>
</html>
