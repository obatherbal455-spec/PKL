<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Post Card</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="blog-post-card">
      <img
        class="post-img"
        src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg"
        alt="A beautiful landscape cover photo"
      />
      <div class="post-content">
        <h2 class="post-title">My Web Development Journey</h2>
        <p class="post-excerpt">
          Learn about my journey in web development and how I started learning
          HTML, CSS, and JavaScript to build modern websites.
        </p>
        <a class="read-more" href="https://www.freecodecamp.org/">
          Read More
        </a>
      </div>
    </div>
  </body>
</html>
